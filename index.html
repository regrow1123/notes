async function decrypt(){
const pw=document.getElementById("pw").value;
try{
const keyData=new TextEncoder().encode(pw);
const hashBuf=await crypto.subtle.digest("SHA-256",keyData);
const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
const iv=raw.slice(0,16);
const enc=raw.slice(16);
const key=await crypto.subtle.importKey("raw",hashBuf,"AES-CBC",false,["decrypt"]);
const dec=await crypto.subtle.decrypt({name:"AES-CBC",iv},key,enc);
const text=new TextDecoder().decode(dec);
const msgs=JSON.parse(text);
const box=document.getElementById("chatBox");
box.innerHTML=msgs.map(m=>{
const cls=m.role==="user"?"u":"a";
const t=m.text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
return `<div class="${cls}">${t}</div>`;
}).join("");
box.style.display="block";
document.getElementById("loginBox").style.display="none";
window.scrollTo(0,document.body.scrollHeight);
}catch(e){alert("Wrong password");}
}
</script>
